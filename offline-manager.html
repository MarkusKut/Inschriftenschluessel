<dialog
  id="offline-manager"
  aria-labelledby="offline-manager-title"
>
  <div class="offline-manager-inner">

   <h2 id="offline-manager-title">
  Offline-Nutzung
</h2>

<p
  id="offline-status"
  aria-live="polite"
>
  Status wird geprüft …
</p>

<p class="offline-install-help">
  <a id="offline-install-link" href="#">
    Wie füge ich den Inschriftenschlüssel zum Home-Bildschirm hinzu?
  </a>
</p>

<progress
  id="offline-progress"
  value="0"
  max="100"
  hidden
></progress>

    <p
      id="offline-progress-text"
      aria-live="polite"
      hidden
    ></p>

    <div class="offline-actions">

      <button
        type="button"
        id="offline-download"
      >
        Alle Inhalte herunterladen
      </button>

      <button
        type="button"
        id="offline-pause"
        hidden
      >
        Pause
      </button>

      <button
        type="button"
        id="offline-resume"
        hidden
      >
        Fortsetzen
      </button>

      <button
        type="button"
        id="offline-cancel"
        hidden
      >
        Abbrechen
      </button>

      <button
        type="button"
        id="offline-close"
      >
        Schließen
      </button>

    </div>

  </div>
</dialog>

<!-- ========================================
     Installation tutorial dialog
     ======================================== -->

<dialog
  id="install-tutorial-dialog"
  aria-label="Anleitung zur Installation"
>
  <div class="install-tutorial-dialog-inner">

    <div class="install-tutorial-header">

      <span>
        Zum Home-Bildschirm hinzufügen
      </span>

      <button
        type="button"
        id="install-tutorial-close"
        aria-label="Anleitung schließen"
      >
        ×
      </button>

    </div>

    <iframe
      id="install-tutorial-frame"
      title="Anleitung zum Hinzufügen zum Home-Bildschirm"
      loading="lazy"
    ></iframe>

  </div>
</dialog>

<script>
document.addEventListener(
  "DOMContentLoaded",
  function () {

    /* ========================================
       Elements
       ======================================== */

    const dialog =
      document.getElementById(
        "offline-manager"
      );

    const downloadButton =
      document.getElementById(
        "offline-download"
      );

    const pauseButton =
      document.getElementById(
        "offline-pause"
      );

    const resumeButton =
      document.getElementById(
        "offline-resume"
      );

    const cancelButton =
      document.getElementById(
        "offline-cancel"
      );

    const closeButton =
      document.getElementById(
        "offline-close"
      );

    const status =
      document.getElementById(
        "offline-status"
      );

    const progress =
      document.getElementById(
        "offline-progress"
      );

    const progressText =
      document.getElementById(
        "offline-progress-text"
      );

/* ========================================
   Installation tutorial link
   ======================================== */

const installLink =
  document.getElementById(
    "offline-install-link"
  );
  
  const tutorialDialog =
  document.getElementById(
    "install-tutorial-dialog"
  );

const tutorialFrame =
  document.getElementById(
    "install-tutorial-frame"
  );

const tutorialClose =
  document.getElementById(
    "install-tutorial-close"
  );

const basePath =
  document.querySelector(
    'meta[name="site-base-path"]'
  )?.content || "/";

installLink.href =
  `${basePath}installieren.html`;


/* ========================================
   Installation tutorial dialog
   ======================================== */

installLink.addEventListener(
  "click",
  function (event) {

    event.preventDefault();

    /*
     * Load tutorial only when needed.
     */
    tutorialFrame.src =
      `${basePath}installieren.html?embed=1`;

    /*
     * Close Offline manager while
     * tutorial is open.
     */
    if (dialog.open) {
      dialog.close();
    }

    tutorialDialog.showModal();
  }
);


tutorialClose.addEventListener(
  "click",
  function () {

    tutorialDialog.close();

    /*
     * Return to Offline manager.
     */
    dialog.showModal();
  }
);


/*
 * Clicking outside the tutorial
 * closes it as well.
 */
tutorialDialog.addEventListener(
  "click",
  function (event) {

    if (
      event.target === tutorialDialog
    ) {

      tutorialDialog.close();

      dialog.showModal();
    }
  }
);


    /* ========================================
       Progress helpers
       ======================================== */

    function setProgress(
      done,
      total
    ) {

      const safeDone =
        Number(done) || 0;

      const safeTotal =
        Number(total) || 0;


      progress.hidden = false;

      progressText.hidden = false;


      /*
       * Avoid progress.max = 0
       */
      progress.max =
        safeTotal > 0
          ? safeTotal
          : 1;


      progress.value =
        Math.min(
          safeDone,
          progress.max
        );


      if (safeTotal > 0) {

        progressText.textContent =
          `${safeDone} von ${safeTotal} Dateien`;

      } else {

        progressText.textContent =
          "Download wird vorbereitet …";
      }
    }


    function hideProgress() {

      progress.value = 0;

      progress.hidden = true;

      progressText.textContent = "";

      progressText.hidden = true;
    }


    /* ========================================
       Button states
       ======================================== */

    function setIdleControls() {

      downloadButton.hidden = false;
      downloadButton.disabled = false;

      pauseButton.hidden = true;
      pauseButton.disabled = false;

      resumeButton.hidden = true;
      resumeButton.disabled = false;

      cancelButton.hidden = true;
      cancelButton.disabled = false;
    }


    function setRunningControls() {

      downloadButton.hidden = true;
      downloadButton.disabled = true;

      pauseButton.hidden = false;
      pauseButton.disabled = false;

      resumeButton.hidden = true;
      resumeButton.disabled = false;

      cancelButton.hidden = false;
      cancelButton.disabled = false;
    }


    function setPausedControls() {

      downloadButton.hidden = true;
      downloadButton.disabled = true;

      pauseButton.hidden = true;
      pauseButton.disabled = false;

      resumeButton.hidden = false;
      resumeButton.disabled = false;

      cancelButton.hidden = false;
      cancelButton.disabled = false;
    }


    function setReadyControls() {

      downloadButton.hidden = false;
      downloadButton.disabled = false;

      downloadButton.textContent =
        "Offline-Inhalte aktualisieren";

      pauseButton.hidden = true;
      pauseButton.disabled = false;

      resumeButton.hidden = true;
      resumeButton.disabled = false;

      cancelButton.hidden = true;
      cancelButton.disabled = false;
    }


    /* ========================================
       Service-worker helper
       ======================================== */

    async function getServiceWorker() {

      if (
        !("serviceWorker" in navigator)
      ) {
        return null;
      }


      try {

        const registration =
          await navigator
            .serviceWorker
            .ready;


        return (
          navigator.serviceWorker.controller ||
          registration.active ||
          registration.waiting ||
          registration.installing ||
          null
        );

      } catch (error) {

        console.error(
          "Service Worker nicht verfügbar:",
          error
        );

        return null;
      }
    }


    async function sendOfflineMessage(
      type
    ) {

      const worker =
        await getServiceWorker();


      if (!worker) {

        status.textContent =
          "Die Offline-Funktion ist in diesem Browser nicht verfügbar.";

        return false;
      }


      worker.postMessage({
        type: type
      });


      return true;
    }


    /* ========================================
       Status request
       ======================================== */

    async function requestOfflineStatus() {

      status.textContent =
        "Status wird geprüft …";


      const ok =
        await sendOfflineMessage(
          "FULL_OFFLINE_STATUS"
        );


      if (!ok) {

        hideProgress();

        setIdleControls();
      }
    }


    /* ========================================
       Open manager
       ======================================== */

    window.openOfflineManager =
      async function () {

        if (!dialog.open) {

          dialog.showModal();
        }


        await requestOfflineStatus();
      };


    /* ========================================
       Close manager
       ======================================== */

    closeButton.addEventListener(
      "click",
      function () {

        /*
         * Closing the dialog does NOT
         * cancel or pause the download.
         */
        dialog.close();
      }
    );


    /*
     * Clicking directly on the backdrop
     * also closes the dialog.
     */
    dialog.addEventListener(
      "click",
      function (event) {

        if (
          event.target === dialog
        ) {

          dialog.close();
        }
      }
    );


    /* ========================================
       Start / update download
       ======================================== */

    downloadButton.addEventListener(
      "click",
      async function () {

        status.textContent =
          "Die Inhalte werden für die Offline-Nutzung gespeichert …";


        setProgress(
          0,
          0
        );


        setRunningControls();


        const ok =
          await sendOfflineMessage(
            "DOWNLOAD_FULL_OFFLINE"
          );


        if (!ok) {

          hideProgress();

          setIdleControls();
        }
      }
    );


    /* ========================================
       Pause
       ======================================== */

    pauseButton.addEventListener(
      "click",
      async function () {

        pauseButton.disabled = true;


        status.textContent =
          "Download wird pausiert …";


        const ok =
          await sendOfflineMessage(
            "PAUSE_FULL_OFFLINE"
          );


        if (!ok) {

          pauseButton.disabled = false;
        }
      }
    );


    /* ========================================
       Resume
       ======================================== */

    resumeButton.addEventListener(
      "click",
      async function () {

        status.textContent =
          "Download wird fortgesetzt …";


        setRunningControls();


        const ok =
          await sendOfflineMessage(
            "RESUME_FULL_OFFLINE"
          );


        if (!ok) {

          setPausedControls();
        }
      }
    );


    /* ========================================
       Cancel
       ======================================== */

    cancelButton.addEventListener(
      "click",
      async function () {

        /*
         * Optional safety check because
         * Cancel deletes the partial
         * full-offline cache.
         */
        const confirmed =
          window.confirm(
            "Offline-Download wirklich abbrechen?\n\n" +
            "Die bisher für den vollständigen Offline-Download " +
            "gespeicherten Dateien werden entfernt."
          );


        if (!confirmed) {
          return;
        }


        status.textContent =
          "Offline-Download wird abgebrochen …";


        pauseButton.disabled = true;

        resumeButton.disabled = true;

        cancelButton.disabled = true;


        const ok =
          await sendOfflineMessage(
            "CANCEL_FULL_OFFLINE"
          );


        if (!ok) {

          pauseButton.disabled = false;

          resumeButton.disabled = false;

          cancelButton.disabled = false;
        }
      }
    );


    /* ========================================
       Messages from Service Worker
       ======================================== */

    if (
      "serviceWorker" in navigator
    ) {

      navigator.serviceWorker
        .addEventListener(
          "message",
          function (event) {

            const data =
              event.data || {};


            /* --------------------------------
               Current status
               -------------------------------- */

            if (
              data.type ===
              "FULL_OFFLINE_STATUS"
            ) {

              /*
               * Complete offline package
               * already available
               */
              if (data.ready) {

                status.textContent =
                  "Alle Inhalte sind offline verfügbar.";


                if (
                  Number(data.total) > 0
                ) {

                  setProgress(
                    data.total,
                    data.total
                  );

                  progressText.textContent =
                    `${data.total} Dateien gespeichert`;

                } else {

                  hideProgress();
                }


                setReadyControls();

                return;
              }


              /*
               * Download currently running
               */
              if (data.running) {

                status.textContent =
                  "Die Inhalte werden für die Offline-Nutzung gespeichert …";


                setProgress(
                  data.done,
                  data.total
                );


                setRunningControls();

                return;
              }


              /*
               * Download paused
               */
              if (data.paused) {

                status.textContent =
                  "Download pausiert. Bereits gespeicherte Inhalte bleiben erhalten.";


                setProgress(
                  data.done,
                  data.total
                );


                setPausedControls();

                return;
              }


              /*
               * No full offline package
               */
              status.textContent =
                "Grundfunktionen und bereits besuchte Seiten sind offline verfügbar.";


              hideProgress();


              downloadButton.textContent =
                "Alle Inhalte herunterladen";


              setIdleControls();

              return;
            }


            /* --------------------------------
               Download started
               -------------------------------- */

            if (
              data.type ===
              "FULL_OFFLINE_START"
            ) {

              status.textContent =
                "Die Inhalte werden für die Offline-Nutzung gespeichert …";


              setProgress(
                data.done || 0,
                data.total
              );


              setRunningControls();

              return;
            }


            /* --------------------------------
               Progress
               -------------------------------- */

            if (
              data.type ===
              "FULL_OFFLINE_PROGRESS"
            ) {

              setProgress(
                data.done,
                data.total
              );


              return;
            }


            /* --------------------------------
               Paused
               -------------------------------- */

            if (
              data.type ===
              "FULL_OFFLINE_PAUSED"
            ) {

              status.textContent =
                "Download pausiert. Bereits gespeicherte Inhalte bleiben erhalten.";


              setProgress(
                data.done,
                data.total
              );


              setPausedControls();

              return;
            }


            /* --------------------------------
               Cancelled
               -------------------------------- */

            if (
              data.type ===
              "FULL_OFFLINE_CANCELLED"
            ) {

              status.textContent =
                "Offline-Download wurde abgebrochen.";


              hideProgress();


              downloadButton.textContent =
                "Alle Inhalte herunterladen";


              setIdleControls();

              return;
            }


            /* --------------------------------
               Complete
               -------------------------------- */

            if (
              data.type ===
              "FULL_OFFLINE_READY"
            ) {

              status.textContent =
                "Alle Inhalte sind jetzt offline verfügbar.";


              setProgress(
                data.total,
                data.total
              );


              progressText.textContent =
                `${data.total} Dateien gespeichert`;


              setReadyControls();

              return;
            }


            /* --------------------------------
               Incomplete
               -------------------------------- */

            if (
  data.type ===
  "FULL_OFFLINE_INCOMPLETE"
) {

  const failed =
    Array.isArray(data.failed)
      ? data.failed
      : [];

  if (failed.length > 0) {

    const names =
      failed.map(
        item => {

          try {

            const url =
              new URL(item.url);

            return decodeURIComponent(
              url.pathname
            );

          } catch {

            return item.url;
          }
        }
      );

    status.innerHTML =
      "Der Offline-Download ist noch nicht vollständig." +
      "<br><br>" +
      "<strong>Nicht geladen:</strong><br>" +
      names
        .map(
          name =>
            "<code>" +
            name
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;") +
            "</code>"
        )
        .join("<br>");

  } else {

    status.textContent =
      "Der Offline-Download ist noch nicht vollständig.";
  }

  setProgress(
    data.done,
    data.total
  );

  downloadButton.textContent =
    "Download fortsetzen";

  setIdleControls();

  return;
}


            /* --------------------------------
               Error
               -------------------------------- */

            if (
              data.type ===
              "FULL_OFFLINE_ERROR"
            ) {

              status.textContent =
                "Beim Offline-Download ist ein Fehler aufgetreten.";


              downloadButton.textContent =
                "Erneut versuchen";


              setIdleControls();

              return;
            }
          }
        );
    }


    /* ========================================
       Initial state
       ======================================== */

    hideProgress();

    setIdleControls();

  }
);
</script>
