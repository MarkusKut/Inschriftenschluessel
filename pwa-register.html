<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      const basePath =
        document.querySelector('meta[name="site-base-path"]')?.content || "/";

      const reg =
        await navigator.serviceWorker.register(
          `${basePath}sw.js`,
          {
            scope: basePath
          }
        );

      console.log(
        "Service Worker registered:",
        reg.scope
      );

    } catch (err) {
      console.error(
        "Service worker registration failed:",
        err
      );
    }
  });
}
</script>
